.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.options button{min-height:75px;font-size:1.25rem}.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}.feedback{min-height:34px;margin-top:16px;font-weight:700}.good{color:#16834c}.bad{color:#bd3841}.muted{color:#5d6a7c}.hidden{display:none}.stat{font-size:.95rem}input{padding:13px;border:2px solid #d6e0f4;border-radius:12px;width:100%;max-width:440px;font-size:1.25rem}.hint{font-size:.95rem;color:#52617b}.center{text-align:center}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.mode{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.mode label{display:flex;align-items:center;gap:6px}.mode input{width:auto}.footer{margin:20px 0;color:#65748b;font-size:.9rem}@media(max-width:540px){.wrap{padding:10px}.panel{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.tabs button{flex:1 1 30%;padding:10px 5px;font-size:.85rem}.options button{font-size:1.1rem;padding:10px 5px}.month{padding:11px}}</style></head><body><div class="wrap"><header><h1>📅 Maanden Trainer</h1><p>Luisteren, spellen, spreken en snel reageren!</p></header><nav class="tabs" id="tabs"><button data-tab="leren" class="active">📚 Leren</button><button data-tab="luisteren">🔊 Luisteren</button><button data-tab="spellen">✍️ Spellen</button><button data-tab="spreken">🎤 Spreken</button><button data-tab="feesten">🎉 Feestdagen</button><button data-tab="sprint">⚡ Sprint</button></nav><main class="panel"><div class="bar"><span class="stat" id="stats">Goed: 0 · Pogingen: 0</span><button id="reset">Opnieuw beginnen</button></div><div id="content"></div></main><p class="footer">Tip: gebruik Chrome of Edge voor spraakherkenning. Voor het luisteren is een Nederlandse stem op je apparaat handig.</p></div><script>
const months=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const holidays=[['Nieuwjaarsdag',1],['Valentijnsdag',2],['Koningsdag',4],['Bevrijdingsdag',5],['Dodenherdenking',5],['Prinsjesdag',9],['Dierendag',10],['Sint-Maarten',11],['Sinterklaasavond',12],['Kerstmis',12],['Oudjaarsavond',12]];
let tab='leren',good=0,attempts=0,current=null,locked=false,wrong=[],sprintLeft=15,sprintStart=0,sprintTimer=null,listenMode='woord',spellMode='nummer';const el=document.getElementById('content');
const rand=n=>Math.floor(Math.random()*n),pick=a=>a[rand(a.length)],shuffle=a=>[...a].sort(()=>Math.random()-.5),cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function speak(s){if(!('speechSynthesis'in window)){feedback('Spraak is niet beschikbaar.',false);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='nl-NL';u.rate=.82;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='nl-nl')||voices.find(v=>v.lang.startsWith('nl'))||null;speechSynthesis.speak(u)}
function feedback(s,ok){let f=document.getElementById('feedback');if(f){f.textContent=s;f.className='feedback '+(ok?'good':'bad')}}
function score(ok,answer){attempts++;if(ok)good++;else wrong.push(answer);document.getElementById('stats').textContent=`Goed: ${good} · Pogingen: ${attempts} · Score: ${Math.round(100*good/attempts)}%`;}
function buttons(vals,correct,onAnswer){return `<div class="options">${shuffle(vals).map(v=>`<button class="answer" data-v="${v}">${v}</button>`).join('')}</div>`}
function bindAnswers(correct,onDone){el.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;let ok=b.dataset.v===String(correct);score(ok,correct);feedback(ok?'Helemaal goed! 🎉':`Bijna! Het goede antwoord is: ${correct}`,ok);b.style.background=ok?'#c7f2d7':'#ffd6d6';onDone?.(ok);setTimeout(()=>{if(tab==='sprint'){sprintLeft--;sprintQuestion()}else nextQuestion()},850)})}
function learning(){el.innerHTML=`<h2>De 12 maanden</h2><p class="hint">Klik op een maand om de uitspraak te horen.</p><div class="grid">${months.map((m,i)=>`<button class="month" data-i="${i}"><small>Maand ${i+1}</small><b>${cap(m)} 🔊</b></button>`).join('')}</div><p class="hint">Zeg hardop: 1 – januari, 2 – februari, 3 – maart ...</p>`;el.querySelectorAll('.month').forEach(b=>b.onclick=()=>speak(months[+b.dataset.i]))}
function four(correct,pool){return shuffle([correct,...shuffle(pool.filter(x=>x!==correct)).slice(0,3)])}
function nextQuestion(){locked=false;if(tab==='leren')return learning();if(tab==='luisteren'){let i=rand(12),correct=listenMode==='woord'?String(i+1):months[i];let vals=listenMode==='woord'?four(correct,months.map((_,j)=>String(j+1))):four(correct,months);el.innerHTML=`<h2>🔊 Luister goed</h2><div class="mode"><label><input type="radio" name="lm" value="woord" ${listenMode==='woord'?'checked':''}> Maand → nummer</label><label><input type="radio" name="lm" value="nummer" ${listenMode==='nummer'?'checked':''}> Nummer → maand</label></div><div class="center"><button class="primary" id="play">🔊 Luister nog eens</button></div><div class="question">?</div>${buttons(vals)}<div class="feedback" id="feedback"></div>`;el.querySelectorAll('[name=lm]').forEach(r=>r.onchange=()=>{listenMode=r.value;nextQuestion()});document.getElementById('play').onclick=()=>speak(listenMode==='woord'?months[i]:String(i+1));bindAnswers(correct);setTimeout(()=>speak(listenMode==='woord'?months[i]:String(i+1)),250);return}
if(tab==='spellen'){let i=rand(12);current=months[i];el.innerHTML=`<h2>✍️ Spel de maand</h2><div class="mode"><label><input type="radio" name="sm" value="nummer" ${spellMode==='nummer'?'checked':''}> Nummer</label><label><input type="radio" name="sm" value="geluid" ${spellMode==='geluid'?'checked':''}> Luisteren</label></div><div class="question">${spellMode==='nummer'?i+1:'🔊'}</div><div class="center"><button id="play">🔊 Luister</button><p><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ de maand..." aria-label="Typ de maand"></p><button class="primary" id="check">Controleren</button><div class="feedback" id="feedback"></div></div>`;el.querySelectorAll('[name=sm]').forEach(r=>r.onchange=()=>{spellMode=r.value;nextQuestion()});document.getElementById('play').onclick=()=>speak(current);let check=()=>{if(locked)return;let answer=document.getElementById('typed').value.trim().toLowerCase();if(!answer)return;locked=true;let ok=answer===current;score(ok,current);feedback(ok?'Goed gespeld! 🎉':`Het juiste woord is: ${current}`,ok);setTimeout(nextQuestion,1300)};document.getElementById('check').onclick=check;document.getElementById('typed').onkeydown=e=>{if(e.key==='Enter')check()};document.getElementById('typed').focus();if(spellMode==='geluid')setTimeout(()=>speak(current),250);return}
if(tab==='spreken'){let i=rand(12);current=months[i];el.innerHTML=`<h2>🎤 Zeg de maand</h2><p class="hint">Welk maandnummer zie je? Spreek de maand duidelijk uit.</p><div class="question">${i+1}</div><div class="actions"><button class="primary" id="mic">🎤 Spreek nu</button><button id="reveal">👀 Toon antwoord</button><button id="skip">Volgende</button></div><div class="center"><p id="heard" class="hint"></p><div class="feedback" id="feedback"></div></div>`;document.getElementById('reveal').onclick=()=>{feedback(cap(current),true);speak(current)};document.getElementById('skip').onclick=nextQuestion;document.getElementById('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){feedback('Spraakherkenning werkt hier niet. Probeer Chrome of Edge.',false);return}let r=new SR();r.lang='nl-NL';r.interimResults=false;r.maxAlternatives=3;feedback('Ik luister...',true);r.onresult=e=>{if(locked)return;let heard=[...e.results[0]].map(x=>x.transcript.toLowerCase().replace(/[.,!?]/g,'').trim());document.getElementById('heard').textContent='Gehoord: '+heard[0];let ok=heard.some(x=>x===current);locked=true;score(ok,current);feedback(ok?'Goed uitgesproken! 🎉':`Probeer nog eens. Het antwoord is: ${current}`,ok);if(ok)setTimeout(nextQuestion,1200);else locked=false};r.onerror=()=>feedback('Microfoon niet beschikbaar. Controleer de toestemming.',false);try{r.start()}catch(e){feedback('Kan microfoon niet starten.',false)}};return}
if(tab==='feesten'){let [name,num]=pick(holidays);current=months[num-1];let vals=four(current,months);el.innerHTML=`<h2>🎉 Nederlandse feestdagen</h2><p class="hint">In welke maand valt deze feestdag?</p><div class="question">${name}</div>${buttons(vals)}<div class="feedback" id="feedback"></div>`;bindAnswers(current);return}}
function sprintQuestion(){locked=false;if(sprintLeft<=0){clearInterval(sprintTimer);el.innerHTML=`<h2>🏁 Klaar!</h2><div class="question">${Math.round(100*good/Math.max(1,attempts))}%</div><p class="center">${good} goed van ${attempts} pogingen.</p><div class="center"><button class="primary" id="again">Nog een keer</button></div>`;document.getElementById('again').onclick=startSprint;return}let i=rand(12),type=rand(2),correct=type?months[i]:String(i+1),vals=type?four(correct,months):four(correct,months.map((_,j)=>String(j+1)));el.innerHTML=`<h2>⚡ Snelle reacties</h2><div class="bar"><b>Vragen over: ${sprintLeft}</b><b id="clock">⏱ ${Math.max(0,Math.ceil((sprintStart+90000-Date.now())/1000))} s</b></div><div class="question">${type?i+1:cap(months[i])}</div>${buttons(vals)}<div class="feedback" id="feedback"></div>`;bindAnswers(correct)}
function startSprint(){good=0;attempts=0;wrong=[];document.getElementById('stats').textContent='Goed: 0 · Pogingen: 0';sprintLeft=15;sprintStart=Date.now();clearInterval(sprintTimer);sprintTimer=setInterval(()=>{if(tab!=='sprint'){clearInterval(sprintTimer);return}let n=Math.max(0,Math.ceil((sprintStart+90000-Date.now())/1000));let c=document.getElementById('clock');if(c)c.textContent=`⏱ ${n} s`;if(!n){sprintLeft=0;sprintQuestion()}},300);sprintQuestion()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{clearInterval(sprintTimer);tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(tab==='sprint')startSprint();else nextQuestion()});document.getElementById('reset').onclick=()=>{good=0;attempts=0;wrong=[];document.getElementById('stats').textContent='Goed: 0 · Pogingen: 0';if(tab==='sprint')startSprint();else nextQuestion()};nextQuestion();
</script></body></html>
